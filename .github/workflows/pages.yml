name: Deploy static site to GitHub Pages

# 教程本身是纯静态 HTML（相对链接），这里只做两件事：
# 1. 把仓库里的“站点文件”挑出来（排除 compiled/*.zo/*.dep 等构建产物）；
# 2. 上传并发布到 GitHub Pages。

# 默认只允许手动触发：Pages 尚未启用时不要在每次 push 后跑一个会失败的部署。
# 以后想用：先在 Settings → Pages → Source 选 GitHub Actions，
# 再把下面的 push 触发器加回来（或直接手动 Run workflow）。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir -p _site
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='_site/' \
            --exclude='node_modules/' \
            --exclude='DESIGN.md' \
            --exclude='compiled/' \
            --exclude='*.zo' \
            --exclude='*.dep' \
            ./ _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
